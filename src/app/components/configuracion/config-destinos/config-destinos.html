<!-- Destinos y fees -->
<section class="tarjeta">
  <h2>{{ t('config.destinos') }}</h2>
  @if (error()) {
    <p class="error-texto" role="alert">{{ error() }}</p>
  }
  @for (d of destinos(); track d.id) {
    <div class="fila">
      <strong [class.inactivo]="!d.activo">{{ d.nombre }}</strong>
      <label class="fee">
        <span class="suave">{{ t('config.fee') }} ({{ moneda }})</span>
        <input type="number" min="0" step="0.01" [name]="'fee-' + d.id" [(ngModel)]="fees[d.id]" />
      </label>
      <button class="boton secundario" type="button" (click)="guardarFee(d)">
        {{ t('app.guardar') }}
      </button>
      <button class="boton secundario" type="button" (click)="alternar(d)">
        {{ d.activo ? t('config.desactivar') : t('config.activar') }}
      </button>
    </div>
  } @empty {
    <p class="suave vacio">{{ t('app.vacio') }}</p>
  }
  <form class="agregar" (ngSubmit)="agregar()">
    <div class="campo">
      <label for="d-nuevo">{{ t('config.nuevo_destino') }}</label>
      <input id="d-nuevo" name="nuevo" type="text" maxlength="80" [(ngModel)]="nuevo" />
    </div>
    <button class="boton" type="submit" [disabled]="!nuevo.trim()">
      {{ t('config.agregar') }}
    </button>
  </form>
</section>
