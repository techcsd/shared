<!-- Configuración -->
<main class="configuracion">
  <h1>{{ t('mas.configuracion') }}</h1>
  <nav class="pestanas" role="tablist">
    @for (s of secciones; track s.id) {
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="seccion() === s.id"
        [class.activa]="seccion() === s.id"
        (click)="seccion.set(s.id)"
      >
        {{ s.etiqueta() }}
      </button>
    }
  </nav>

  @switch (seccion()) {
    @case ('grupo') {
      <app-config-grupo />
    }
    @case ('activos') {
      <app-config-activos />
    }
    @case ('destinos') {
      <app-config-destinos />
    }
    @case ('tipos') {
      <app-config-tipos />
    }
    @case ('temporada') {
      <app-config-temporada />
    }
    @case ('correos') {
      <app-config-correos />
    }
  }
</main>
