<!-- Icono SVG en línea (decorativo: el texto de al lado lo describe) -->
<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @for (d of trazos(); track $index) {
    <path [attr.d]="d" />
  }
</svg>
